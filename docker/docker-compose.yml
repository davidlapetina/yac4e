services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yac4e
      POSTGRES_USER: yac4e
      POSTGRES_PASSWORD: yac4e
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yac4e-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yac4e -d yac4e"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  yac4e-postgres:
