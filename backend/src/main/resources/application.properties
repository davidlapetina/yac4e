quarkus.application.name=YaC4e
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.root-path=/
quarkus.rest.path=/api
quarkus.http.limits.max-body-size=10M

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME:yac4e}
quarkus.datasource.password=${DATABASE_PASSWORD:yac4e}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yac4e}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs

quarkus.log.category."com.example.c4editor".level=INFO

yac4e.auth.enabled=${YAC4E_AUTH_ENABLED:true}
yac4e.auth.basic.username=${YAC4E_BASIC_USERNAME:admin}
yac4e.auth.basic.password=${YAC4E_BASIC_PASSWORD:admin}
yac4e.auth.basic.principal-id=${YAC4E_BASIC_PRINCIPAL_ID:local-user}
yac4e.auth.seed-agent-token.enabled=${YAC4E_SEED_AGENT_TOKEN_ENABLED:true}
yac4e.auth.seed-agent-token=${YAC4E_SEED_AGENT_TOKEN:yac4e-dev-agent-token}
yac4e.auth.seed-agent-token.name=${YAC4E_SEED_AGENT_TOKEN_NAME:Development agent token}
yac4e.auth.seed-agent-token.principal-id=${YAC4E_SEED_AGENT_TOKEN_PRINCIPAL_ID:local-agent}

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
